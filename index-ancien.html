<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devis et factures — DC RENOV</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Devis DC RENOV">
<style>
:root{--bg:#f2f5f7;--card:#fff;--tx:#18222c;--mut:#5f6c78;--bd:#d3dbe1;--acc:#1f3a4d;--on:#fff;--soft:#e6edf1;--danger:#d9534f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11171c;--card:#1a232b;--tx:#e8edf1;--mut:#9aa7b3;--bd:#33414d;--acc:#6fb0d6;--on:#0c1216;--soft:#243039;--danger:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;transition:background 0.3s, color 0.3s}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px}
header h1{font-size:18px;margin:6px 0}
.pb{height:6px;background:var(--soft);border-radius:4px;margin:8px 0 4px;overflow:hidden}.pb i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
#stt{color:var(--mut);font-size:14px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow: 0 2px 5px rgba(0,0,0,0.05)}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 10px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;transition:border-color 0.2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
input[type=checkbox]{display:inline-block;width:auto;margin:0 8px 0 0}
.g3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;padding:11px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;transition:all 0.2s}
button:hover{background:var(--soft)}
button.pri{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
button.pri:hover{opacity:0.9}
button.danger{color:var(--danger);border-color:var(--danger)}
button.danger:hover{background:rgba(217,83,79,0.1)}
#nav{display:flex;gap:10px;justify-content:space-between;position:sticky;bottom:0;padding:10px 0;background:var(--bg);margin-top:10px}
#nav button{flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint{font-size:13px;color:var(--mut)}
.big{font-size:20px;font-weight:700}
.list-item{border:1px solid var(--bd); padding:12px; border-radius:8px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;background:var(--card)}
.list-item-info h4{margin:0 0 4px; font-size:14px;}
.list-item-info p{margin:0; font-size:12px; color:var(--mut);}
.list-actions{display:flex; gap:8px;}
.btn-sm{padding:6px 10px; font-size:12px; border-radius:6px;}
.doc{background:#fff;color:#111;font:11px/1.4 Arial,Helvetica,sans-serif;border:1px solid #d3dbe1;border-radius:6px;padding:20px;margin-bottom:12px}
.doc *{box-sizing:border-box}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
.dh img{width:120px;height:auto;object-fit:contain}
.dt{text-align:right}
.dt h1{margin:0 0 8px;font-size:24px;color:#1f3a4d;text-transform:uppercase;letter-spacing:1px}
.dt table{margin-left:auto;border-collapse:collapse}
.dt td{padding:2px 0 2px 8px;font-size:11px}
.dt td:first-child{color:#1f3a4d;font-weight:700;text-align:right}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px}
.dg h3{margin:0 0 6px;padding:4px 6px;background:#e6edf1;color:#1f3a4d;font-size:11px;text-transform:uppercase}
.dg p{margin:0;padding:2px 0;border-bottom:1px solid #e1e7ec;min-height:16px}
.ln{width:100%;border-collapse:collapse;margin-top:10px}
.ln th{background:#1f3a4d;color:#fff;font-size:10px;padding:8px;text-align:left}
.ln td{border-bottom:1px solid #d9e0e5;padding:8px;vertical-align:top}
.ln .r{text-align:right;white-space:nowrap}
.ln .c{text-align:center}
.tot{margin:15px 0 5px auto;border-collapse:collapse;min-width:250px}
.tot td{padding:5px 8px;text-align:right}
.tot tr.b td{font-weight:700}
.tot tr.f td{background:#e6edf1;color:#1f3a4d;font-weight:700;font-size:13px}
.note{font-size:9px;color:#666;font-style:italic;margin:8px 0}
.ment{margin-top:15px;font-size:9px;color:#333;border-top:1px solid #eee;padding-top:10px}
.ment h4{margin:0 0 4px;color:#1f3a4d;font-size:10px}
.ment p{margin:0 0 4px}
.sig{margin-top:20px;font-weight:700;color:#1f3a4d;font-size:11px}
.sig div{height:60px;border:1px solid #888;margin-top:4px;padding:4px;font-weight:400;font-style:italic;font-size:10px;color:#666}
@media print{body{background:#fff}.ui{display:none!important}.wrap{padding:0;max-width:none}.doc{border:0!important;border-radius:0!important;padding:0!important;margin:0!important}@page{size:A4;margin:10mm}}
</style>
</head>
<body>
<div class="wrap">
<header class="ui">
  <h1>DC RENOV</h1>
  <div style="display:flex; gap:8px;">
    <button data-a="history" style="padding:8px 12px; font-size:14px;">📂 Historique</button>
    <button data-a="set" style="padding:8px 12px; font-size:14px;">⚙️ Réglages</button>
  </div>
</header>
<div class="ui"><div class="pb"><i id="bar"></i></div><p id="stt"></p></div>
<div id="app"></div>
<div id="nav" class="ui"></div>
</div>
